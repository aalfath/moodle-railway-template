ServerName localhost
ServerTokens Prod
ServerSignature Off
<Directory /var/www/html/public>
    AllowOverride None
    Require all granted
    FallbackResource /r.php
</Directory>
# Health check for Railway: answers without logging in and without Moodle's host redirect.
Alias /healthz /opt/moodle-railway/health/healthz.php
<Directory /opt/moodle-railway/health>
    Require all granted
</Directory>
